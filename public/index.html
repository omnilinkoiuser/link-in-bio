<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>OmniLinkWebBuilder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=DM+Serif+Display&family=Syne:wght@400;700;800&family=Outfit:wght@400;600;700&family=Archivo:wght@400;600;800&family=Nunito:wght@400;600;800&family=Caveat:wght@500;700&family=Space+Mono:wght@400;700&family=Lora:wght@400;600;700&family=Playfair+Display:wght@400;700&family=Bebas+Neue&family=Pacifico&display=swap">
<style>
/* Layout: Canva-like studio shell. Icon rail → tool panel → phone-framed live canvas. On phones the rail becomes a scrolling strip and an Edit/Preview switch swaps panel and canvas. */
:root{
  --bg:#eceee9; --panel:#fafbf8; --ink:#1a1e1c; --muted:#5b645f; --line:#d5dad3;
  --accent:#1f6b57; --accent-ink:#ffffff; --soft:#e1e8e3; --danger:#b4432c; --ok:#2f8a4f; --warn:#b7791f;
  --frame:#1a1e1c;
  --f-display:'Bricolage Grotesque', 'Figtree', system-ui, sans-serif;
  --f-body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111413; --panel:#191d1b; --ink:#e6ebe7; --muted:#97a19b; --line:#2b322f;
  --accent:#4cb593; --accent-ink:#0b1914; --soft:#21302a; --danger:#ec7a5f; --ok:#5fcf86; --warn:#e3b04b; --frame:#050606; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111413; --panel:#191d1b; --ink:#e6ebe7; --muted:#97a19b; --line:#2b322f;
  --accent:#4cb593; --accent-ink:#0b1914; --soft:#21302a; --danger:#ec7a5f; --ok:#5fcf86; --warn:#e3b04b; --frame:#050606; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}

.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding-block:12px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand span{color:var(--muted);font-size:13px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);
  padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;position:relative;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn>svg{width:16px;height:16px;flex:none}
.btn.icon{padding:6px;width:30px;height:30px}
.btn.icon svg{width:16px;height:16px}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{color:var(--danger)}
.btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}

.switch{display:none;gap:4px;padding:3px;background:var(--soft);border-radius:9px}
.switch button{border:0;background:transparent;padding:6px 14px;border-radius:7px;font-weight:600;cursor:pointer;color:var(--muted)}
.switch button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.app{flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,340px) minmax(0,1fr)}
.rail{display:flex;flex-direction:column;gap:2px;padding:10px 6px;padding-left:max(6px, env(safe-area-inset-left, 0px));border-right:1px solid var(--line);background:var(--panel);overflow-y:auto}
.rail button{display:flex;flex-direction:column;align-items:center;gap:5px;width:70px;padding:10px 4px;border:0;background:none;border-radius:10px;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer}
.rail button svg{width:22px;height:22px}
.rail button:hover{color:var(--ink)}
.rail button[aria-selected="true"]{background:var(--soft);color:var(--ink)}
.panel{overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:22px 20px 56px;display:flex;flex-direction:column;gap:28px}
.grp{display:flex;flex-direction:column;gap:14px}
.grp h2{font-family:var(--f-display);font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.hint{color:var(--muted);font-size:12.5px;margin:-8px 0 0}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.field output{font-family:var(--f-mono);text-transform:none;letter-spacing:0}
input[type=text],input[type=url],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
textarea{resize:vertical;min-height:80px}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.color{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--bg);cursor:pointer;min-width:0}
.color input[type=color]{width:28px;height:26px;border:0;padding:0;background:none;cursor:pointer;flex:none}
.color code{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);padding:7px 11px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--ink);font-weight:700}
.seg.sm button{padding:5px 9px;font-size:12px}
.chk{display:flex;align-items:center;gap:9px;font-weight:500;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--accent)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center}
.contrast{margin:0;font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.contrast i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
.contrast i.good{background:var(--ok)} .contrast i.mid{background:var(--warn)} .contrast i.bad{background:var(--danger)}

.tpls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tpl{border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--bg);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.tpl:hover{border-color:var(--muted)}
.tpl[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.mini{aspect-ratio:4/5;max-width:100%;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px}
.mini i{display:block;width:26px;height:26px}
.mini em{display:block;width:60%;height:6px;border-radius:3px;opacity:.85}
.mini s{display:block;width:84%;height:14px}
.tn strong{display:block;font-size:14px;padding:0 2px;font-weight:700}
.tn small{display:block;color:var(--muted);font-size:11.5px;padding:0 2px 2px}

.upload{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.thumb{width:60px;height:60px;border-radius:12px;background:var(--soft) center/cover no-repeat;border:1px solid var(--line);flex:none;display:grid;place-items:center;font-weight:700;color:var(--muted)}

.list{display:flex;flex-direction:column;gap:10px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.card.open{border-color:var(--accent)}
.card-h{display:flex;align-items:center;gap:6px;padding:6px 8px}
.card-h select{flex:1;min-width:0;padding:7px 9px}
.card-t{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;cursor:pointer;padding:4px;border-radius:8px}
.ct{min-width:0;display:flex;flex-direction:column}
.ct b,.ct small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct small{color:var(--muted);font-size:12px}
.ci{width:34px;height:34px;border-radius:9px;background:var(--soft) center/cover no-repeat;display:grid;place-items:center;flex:none;color:var(--ink)}
.ci svg{width:18px;height:18px}
.mini-ctrls{display:flex;gap:2px;flex:none}
.mini-ctrls .btn{border-color:transparent;background:transparent}
.mini-ctrls .btn:hover{border-color:var(--line)}
.card-b{border-top:1px solid var(--line);padding:14px 12px;display:flex;flex-direction:column;gap:14px}
.sub{border-left:2px solid var(--accent);padding-left:12px;display:flex;flex-direction:column;gap:14px}

.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.igrid button{aspect-ratio:1;border:1px solid var(--line);background:var(--panel);border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.igrid button svg{width:20px;height:20px}
.igrid button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);box-shadow:inset 0 0 0 1px var(--accent)}
.igrid .none{grid-column:span 2;aspect-ratio:auto;font-size:12px;font-weight:600}
.ipick{display:flex;flex-direction:column;gap:8px}
.ipick>.btn{align-self:flex-start}
.ipick>.btn svg{width:18px;height:18px}

.ugrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.uitem{display:flex;flex-direction:column;gap:6px;min-width:0}
.checker{background-color:var(--panel);background-image:conic-gradient(var(--soft) 25%, transparent 0 50%, var(--soft) 0 75%, transparent 0);background-size:14px 14px}
.uimg{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);position:relative;overflow:hidden}
.uimg span{position:absolute;inset:0;background:center/contain no-repeat}
.uact{display:flex;gap:4px;flex-wrap:wrap}
.uact .primary{flex:1 1 100%}
.upick{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:6px}
.upick button,.upick .add{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);cursor:pointer;position:relative;overflow:hidden;display:grid;place-items:center;font-size:11.5px;font-weight:600;padding:0}
.upick button span{position:absolute;inset:0;background:center/cover no-repeat}
.upick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.upick .add{background:var(--panel);color:var(--muted);font-size:20px;font-weight:400}
.upick .add input{position:absolute;inset:0;opacity:0;cursor:pointer}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border:1px solid var(--line);border-radius:999px;background:var(--bg);cursor:pointer;font-size:12.5px;font-weight:600}
.chip:hover{border-color:var(--muted)}
.chipic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;overflow:hidden}
.chipic svg{width:14px;height:14px}
.chipic.lg{width:34px;height:34px}
.chipic.lg svg{width:18px;height:18px}
.chipic img{width:100%;height:100%;object-fit:cover}

.walls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wall{aspect-ratio:3/4;max-width:100%;border-radius:10px;border:1px solid var(--line);cursor:pointer;display:flex;align-items:flex-end;justify-content:flex-start;padding:6px}
.wall:hover{outline:2px solid var(--muted);outline-offset:1px}
.wall span{background:var(--panel);color:var(--ink);font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.drop{border:1.5px dashed var(--line);border-radius:12px;padding:20px 16px;text-align:center;color:var(--muted);cursor:pointer;position:relative;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.drop b{color:var(--ink);font-size:14px}
.drop.over{border-color:var(--accent);background:var(--soft)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}

.stage{display:flex;flex-direction:column;align-items:center;gap:12px;min-height:0;overflow:hidden;
  padding-block:18px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.stage{position:relative}
.stagebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;width:100%;max-width:1200px}
.sb-hint{color:var(--muted);font-size:12.5px}
.frame{flex:1;min-height:0;display:flex;flex-direction:column;box-shadow:0 30px 60px -30px rgba(0,0,0,.45)}
.frame.phone{width:min(400px,100%);max-height:none;border-radius:40px;background:var(--frame);padding:10px}
.frame.pc{width:100%;max-width:1200px;border-radius:12px;border:1px solid var(--line);background:var(--panel);overflow:hidden}
.frame.phone .chrome{display:none}
.screen{flex:1;min-height:0;width:100%;overflow:hidden;background:#ffffff;isolation:isolate}
.frame.phone .screen{border-radius:31px}
.app.collapsed{grid-template-columns:auto minmax(0,1fr)}
.tadd{display:flex;flex-direction:column;gap:8px}
.tbtn{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;cursor:pointer;color:var(--ink);line-height:1.15}
.tbtn:hover,.elb:hover{border-color:var(--muted)}
.elgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.elb{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;padding:10px;cursor:pointer;background:var(--bg)}
.elb img{max-width:100%;max-height:100%}
.wall.up{position:relative;align-items:center;justify-content:center;flex-direction:column;gap:4px;background:var(--panel);border-style:dashed;color:var(--muted);font-weight:600;font-size:12px;text-align:center}
.wall.up b{font-size:22px;font-weight:400;line-height:1}
.wall.up input{position:absolute;inset:0;opacity:0;cursor:pointer}
.app.collapsed .panel{display:none}
.insp{position:absolute;z-index:6;width:288px;max-width:calc(100% - 16px);max-height:min(580px, calc(100% - 16px));overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 44px -16px rgba(0,0,0,.4)}
.insp-h{display:flex;align-items:center;gap:6px;padding:9px 9px 9px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.insp-h b{flex:1;min-width:0;font-family:var(--f-display);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.insp-h .btn svg{width:15px;height:15px}
.insp-b{padding:14px;display:flex;flex-direction:column;gap:14px}
.insp-b h4{margin:6px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink);border-top:1px solid var(--line);padding-top:14px}
.insp .walls{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.insp .wall{aspect-ratio:1}
.insp .wall span{display:none}
.rnd{display:flex;align-items:center;gap:8px}
.rnd i{width:14px;height:14px;border:2px solid var(--muted);flex:none}
.rnd i.r{border-radius:50%}
.rnd input{flex:1;min-width:0}
.screen.over{outline:3px dashed var(--accent);outline-offset:-3px}
.url{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

.modal{position:fixed;inset:0;background:rgba(10,12,11,.55);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(640px,100%);max-height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.dialog h3{font-family:var(--f-display);margin:0;font-size:20px}
.dialog ol{margin:0;padding-left:20px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.dialog textarea{font-family:var(--f-mono);font-size:11.5px;min-height:200px;white-space:pre;overflow:auto}
.dialog .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:999px;font-weight:600;font-size:13px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.pub-form textarea{min-height:72px;font-family:var(--f-body);font-size:14px;white-space:normal}
.pubd{width:100%;height:100%;padding:0;gap:0;overflow:hidden}
.pub-top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pub-top h3{flex:1;min-width:0}
.pub-top .btn.icon svg{width:18px;height:18px}
.pub-body{flex:1;min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr)}
.pub-form{overflow:auto;padding:18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px;background:var(--panel)}
.pub-prev{overflow:auto;padding:22px;background:var(--bg);display:flex;gap:22px;align-items:flex-start;justify-content:center}
.dev.pc{flex:1;min-width:0;max-width:none;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--panel);box-shadow:0 20px 40px -24px rgba(0,0,0,.4)}
.chrome{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.chrome i{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.chrome span{flex:1;min-width:0;margin-left:8px;background:var(--bg);border-radius:6px;padding:4px 10px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fit{position:relative;overflow:hidden;width:100%}
.fit iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0;background:#ffffff}
#pcFrame{width:1280px;height:800px}
#phFrame{width:390px;height:780px}
.dev.ph{flex:none;width:290px;border-radius:30px;background:var(--frame);padding:8px}
.dev.ph .fit{border-radius:23px}
.pub-prev[data-dev="phone"] .pc,.pub-prev[data-dev="pc"] .ph{display:none}
.pub-prev[data-dev="phone"] .ph{width:390px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:flex;gap:8px;align-items:baseline;font-size:13px}
.checks i{width:9px;height:9px;border-radius:50%;flex:none;transform:translateY(1px)}
.checks .ok i{background:var(--ok)} .checks .warn i{background:var(--warn)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.steps a{color:var(--accent);font-weight:600}
.big{padding:12px 16px;font-size:14px}
#codeBox{font-family:var(--f-mono);font-size:11px;min-height:140px;white-space:pre}
@media (max-width: 900px){
  .pub-body{grid-template-columns:minmax(0,1fr);overflow:auto}
  .pub-form{border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  .pub-prev{overflow:visible;flex-direction:column;align-items:center}
  .dev.pc{width:100%;flex:none}
}
.brand #tplBack svg{width:16px;height:16px}
.brand #tplBack{margin-right:4px}
.gallery{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-block:env(safe-area-inset-top,0px) 48px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.gal-in{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:24px}
.gal-tools{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 0 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
#galSearch{max-width:520px;padding:11px 14px;font-size:15px;border-radius:10px}
.gchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.gchip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink)}
.gchip small{color:var(--muted);font-weight:500;margin-left:2px}
.gchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gchip[aria-pressed="true"] small{color:inherit;opacity:.7}
.gal-secs{display:flex;flex-direction:column;gap:34px;padding-top:8px}
.gsec h2{font-family:var(--f-display);font-size:20px;margin:0 0 12px;letter-spacing:-.01em}
.gal-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.gal-top .kicker{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.02em}
.gal-top h1{font-family:var(--f-display);font-size:clamp(28px,4vw,40px);line-height:1.05;margin:6px 0 8px;letter-spacing:-.02em;text-wrap:balance}
.gal-top p{margin:0;color:var(--muted);max-width:60ch;font-size:15px}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.gcard{position:relative;display:flex;flex-direction:column;gap:10px;padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--panel);cursor:pointer;text-align:left;transition:transform .15s, box-shadow .15s;min-width:0}
.gcard:hover{transform:translateY(-3px);box-shadow:0 18px 32px -20px rgba(0,0,0,.45)}
.gcard.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.gprev{display:block;aspect-ratio:390/620;max-width:100%;border-radius:10px;overflow:hidden;background:var(--soft)}
.gmeta{display:flex;flex-direction:column;gap:2px;padding:0 4px 4px;position:relative}
.gmeta b{font-size:15px;padding-right:70px}
.gmeta small{color:var(--muted);font-size:12.5px}
.pill{position:absolute;right:4px;top:0;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.guse{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:700;font-size:13px;opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap}
.gcard:hover .guse,.gcard:focus-visible .guse{opacity:1}
@media (max-width:520px){.gal-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.gcard{padding:6px}.guse{display:none}}
.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}

@media (max-width: 900px){
  html,body{height:auto}
  body{display:block}
  .switch{display:flex}
  .app{display:block}
  .rail{flex-direction:row;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-right:0;border-bottom:1px solid var(--line);
    padding:6px max(8px, env(safe-area-inset-right, 0px)) 6px max(8px, env(safe-area-inset-left, 0px))}
  .rail button{flex:none;width:auto;min-width:66px;padding:7px 6px}
  .panel{overflow:visible;border-right:0;padding:20px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px))}
  .app[data-view="edit"] .stage{display:none}
  .app[data-view="preview"] .rail,.app[data-view="preview"] .panel{display:none}
  .stage{overflow:visible}
  .frame{flex:none;height:calc(100dvh - 150px);min-height:520px}
  .frame.phone{padding:0;border-radius:14px;width:100%;background:transparent;box-shadow:none}
  .frame.phone .screen{border-radius:14px}
  .stagebar .sb-hint{display:none}
  .insp{position:fixed;left:0!important;right:0;top:auto!important;bottom:0;width:auto;max-width:none;max-height:55vh;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .insp-h{padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:max(9px, env(safe-area-inset-right, 0px))}
  .insp-b{padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:max(14px, env(safe-area-inset-right, 0px))}
}
@media (max-width: 420px){ .walls{grid-template-columns:repeat(2,minmax(0,1fr))} .brand span{display:none} }
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

</div>

    soft:[f,l,'transparent','0 10px 24px -12px rgba(0,0,0,.5)',f,l,'0 16px 30px -12px rgba(0,0,0,.55)','0px']}[st]||null;

function socHTML(s,S,E,pos){

    if(so.color==='brand'){ if(plain)ic=p.c; else{ic=p.ink||'#ffffff';sb=p.c;bd=p.c;} }
    else if(so.color==='accent'){ if(plain)ic=s.accent; else{ic=s.btnText;sb=s.accent;bd=s.accent;} }
    else { ic=s.text; bd=hexA(s.text,.35); }
    if(x.bare&&!plain){if(so.color==='brand')ic=p.c;else if(so.color==='accent')ic=s.accent;else ic=s.text;}
    const inner=im?`<img src="${im}" alt="">`:svg(x.icon&&ICONS[x.icon]?x.icon:p.ic);
    return `<a class="si${im?' hasimg':''}${x.bare?' bare':''}" href="${esc(E.ed?'#':safeUrl(x.url,x.platform))}"${E.ed?'':' target="_blank" rel="noopener"'} style="--ic:${ic};--sb:${sb};--bd:${bd}" aria-label="${esc(p.n)}" title="${esc(p.n)}"${E('soc:'+x.id)}>${inner}${so.labels?`<span>${esc(p.n)}</span>`:''}</a>`;
  });
  return items.length?`<nav class="c soc ${so.frame?'framed':'plain'}${so.labels?' labels':''}${pos==='bottom'?' bottom':''}" aria-label="Social accounts"${E('social')}>${items.join('')}</nav>`:'';
}

    const cls=['btn',b.size||s.size,b.width==='fit'?'fit':'',st==='glass'?'glass':'',b.anim&&b.anim!=='none'?'an-'+b.anim:'',th?'hasth':''].filter(Boolean).join(' ');
    const sty=b.custom?`${btnVars(b.cStyle,b.cFill,b.cFg,s.text)};--r:${radPx(b.cRound)}px`:'';

  const hero=`<div class="hero" id="top"><main class="wrap ${lay}">

}
function musicHTML(s,ed){

const EDCSS=`:host{display:block;height:100%}
.pg{height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain;position:relative}
.pg::-webkit-scrollbar{display:none}

.pb .is-sel,.pb .is-sel:hover{outline:2px solid #3b82f6;outline-offset:4px}

const screen=$('screen');

const pcss=shadow.getElementById('pcss'),pg=shadow.getElementById('pg'),pb=shadow.getElementById('pb');

let raf=0;
function render(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;doRender();});}
function doRender(){
  if(editing)return;
  pcss.textContent=buildCSS(state,'.pb',src);
  pb.innerHTML=buildBody(state,src,true);
  applySel();
  $('urlBar').textContent=siteSlug()+'.netlify.app';

}
const slugify=s=>String(s||'').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
const siteSlug=()=>slugify(state.site.slug)||slugify(state.site.title)||slugify(state.name)||'my-site';
function syncInputs(k,v,except){document.querySelectorAll('[data-k]').forEach(o=>{if(o!==except&&o.dataset.k===k&&o.type!=='file'){if(o.type==='checkbox')o.checked=!!v;else if(o.value!==String(v))o.value=v;}});}

/* undo / redo: snapshots keep image ids; image data stays in a pool */
const pool=new Map();
function snap(){state.uploads.forEach(u=>pool.set(u.id,u));return JSON.stringify(Object.assign({},state,{uploads:state.uploads.map(u=>u.id)}));}
function restore(str){const d=JSON.parse(str);d.uploads=d.uploads.map(id=>pool.get(id)).filter(Boolean);state=d;}
let hist=[],hi=-1,histT=null;
function commitNow(){clearTimeout(histT);histT=null;const s=snap();if(s===hist[hi])return;hist=hist.slice(0,hi+1);hist.push(s);if(hist.length>80)hist.shift();hi=hist.length-1;updHist();}
function commitHist(){clearTimeout(histT);histT=setTimeout(commitNow,450);}
function updHist(){$('undoBtn').disabled=hi<=0;$('redoBtn').disabled=hi>=hist.length-1;}
function stepHist(d){if(histT)commitNow();const j=hi+d;if(j<0||j>=hist.length)return;hi=j;restore(hist[hi]);
  const [t,id]=(sel||'').split(':');const arr={btn:'links',soc:'socials',lay:'layers'}[t];if(arr&&!byId(state[arr],id))sel=null;
  renderPanel();renderSelbar();doRender();updHist();toast(d<0?'Undone':'Redone');}
$('undoBtn').innerHTML=svg('undo');$('redoBtn').innerHTML=svg('redo');
$('undoBtn').onclick=()=>stepHist(-1);$('redoBtn').onclick=()=>stepHist(1);
function selEl(){return sel?pb.querySelector(`[data-e="${sel}"]`):null;}
function applySel(){
  pb.querySelectorAll('.is-sel').forEach(e=>e.classList.remove('is-sel'));
  pb.querySelectorAll('.rsz').forEach(e=>e.remove());
  const el=selEl(); if(!el)return;
  el.classList.add('is-sel');
  if(sel.startsWith('lay:')){const h=document.createElement('div');h.className='rsz';h.title='Drag to resize';el.parentElement.appendChild(h);positionHandle();}
}
function positionHandle(){const el=selEl(),h=pb.querySelector('.rsz');if(el)requestAnimationFrame(positionInsp);if(!el||!h)return;h.style.left=(el.offsetLeft+el.offsetWidth)+'px';h.style.top=(el.offsetTop+el.offsetHeight)+'px';}
shadow.addEventListener('load',positionHandle,true);

function select(k,open=true){
  if(k!==sel)ui.iconFor=null;
  sel=k;applySel();renderInsp();
  if(ui.tab==='images'||ui.tab==='buttons'||ui.tab==='social'){document.querySelectorAll('.card.selcard').forEach(c=>c.classList.remove('selcard'));}
}

/* pointer: select, drag, resize */
shadow.addEventListener('pointerdown',e=>{
  if(e.button!==0)return;
  const h=e.target.closest('.rsz');
  if(h&&sel&&sel.startsWith('lay:')){e.preventDefault();startDrag(e,sel.slice(4),'resize');return;}
  const t=e.target.closest('[data-e]');
  if(t&&t.isContentEditable)return;
  if(!t){if(!e.target.closest('[contenteditable]')&&sel!=='page')select('page');return;}
  const k=t.dataset.e;
  if(k!==sel)select(k);
  if(k.startsWith('lay:')){e.preventDefault();startDrag(e,k.slice(4),'move');}
});
shadow.addEventListener('click',e=>{if(e.target.closest('a'))e.preventDefault();const a=e.target.closest('.nav a');if(a){const t=pb.querySelector(a.getAttribute('href'));if(t)t.scrollIntoView({behavior:'smooth',block:'start'});}});
shadow.addEventListener('dblclick',e=>{const t=e.target.closest('[data-t]');if(t)startInline(t);});

function startDrag(e,id,mode){
  const l=byId(state.layers,id),el0=selEl();if(!l||!el0)return;
  const wrap=el0.parentElement,W=wrap.clientWidth,sx=e.clientX,sy=e.clientY,l0=el0.offsetLeft,t0=el0.offsetTop,w0=el0.offsetWidth;
  let moved=false;
  const mv=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;if(!moved&&Math.abs(dx)+Math.abs(dy)<3)return;moved=true;
    const el=selEl();if(!el)return;
    if(mode==='move'){l.x=round1((l0+dx)/W*100);l.y=Math.round(t0+dy);el.style.left=l.x+'%';el.style.top=l.y+'px';}
    else{l.w=Math.max(4,round1((w0+dx)/W*100));el.style.width=l.w+'%';}
    positionHandle();};
  const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
    if(moved){render();if(ui.tab==='images')renderPanel();}};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
}

/* inline text editing, like double-clicking text in Canva */
function startInline(el){
  const path=el.dataset.t;editing=path;
  try{el.contentEditable='plaintext-only';}catch(err){el.contentEditable='true';}
  if(el.contentEditable!=='plaintext-only')el.contentEditable='true';
  el.focus();
  try{const r=document.createRange();r.selectNodeContents(el);const s=window.getSelection();s.removeAllRanges();s.addRange(r);}catch(err){}
  const onInput=()=>{const v=el.innerText.replace(/\n$/,'');set(path,(path==='bio'||path.endsWith('.txt'))?v:v.replace(/\n/g,' '));syncInputs(path,get(path));afterChange(path);scheduleSave();};
  const onKey=ev=>{if(ev.key==='Escape'||(ev.key==='Enter'&&path!=='bio'&&!path.endsWith('.txt'))){ev.preventDefault();el.blur();}};
  const end=()=>{el.removeEventListener('input',onInput);el.removeEventListener('keydown',onKey);el.removeAttribute('contenteditable');editing=null;render();};
  el.addEventListener('input',onInput);el.addEventListener('keydown',onKey);el.addEventListener('blur',end,{once:true});
}

function contrastMsg(){

<button type="button" class="btn" data-act="addLink">+ Add a button</button></section>

${seg('btnStyle','Style',STYLES)}${seg('size','Size',[['s','Small'],['m','Medium'],['l','Large']])}${roundSlider('round','Corners for all buttons')}

function socCard(x,i,n){
  const p=PLAT[x.platform]||PLAT.website,pp=`socials#${x.id}`,open=ui.iconFor===pp+'.icon',im=x.img&&src(x.img);
  return `<div class="card" id="card-${x.id}"><div class="card-h">
  <span class="chipic lg" style="background:${p.c};color:${p.ink||'#ffffff'}">${im?`<img src="${im}" alt="">`:svg(x.icon||p.ic)}</span>
  <select id="${fid(pp+'.platform')}" data-k="${pp}.platform" data-r aria-label="Platform">${Object.entries(PLAT).map(([k,v])=>`<option value="${k}"${k===x.platform?' selected':''}>${v.n}</option>`).join('')}</select>
  <div class="mini-ctrls">${ctrl('socials',x.id,i,n)}</div></div>
  <div class="card-b">${inp(pp+'.url','Link or handle',{ph:p.p+'yourname'})}
  <div class="ipick"><button type="button" class="btn sm" data-act="iconOpen" data-path="${pp}.icon" aria-expanded="${open}">${open?'Done':'Change icon'}</button>
  ${open?`<div class="field"><span class="lbl">Icons</span><div class="igrid"><button type="button" class="none" data-act="pickIcon" data-path="${pp}.icon" data-icon="" aria-pressed="${!x.icon&&!x.img}">Default</button>${LIB.map(k=>`<button type="button" data-act="pickIcon" data-path="${pp}.icon" data-icon="${k}" title="${cap(k)}" aria-label="${cap(k)}" aria-pressed="${x.icon===k&&!x.img}">${svg(k)}</button>`).join('')}</div></div>
  <div class="field"><span class="lbl">Or use your own logo image</span>${uploadPicker(pp+'.img')}<span class="hint" style="margin:0">Official logos can be downloaded from each platform’s brand or press page. A PNG or SVG with a transparent background works best.</span></div>`:''}</div>
  ${check(pp+'.bare','Show logo as-is (no circle or background)',true)}</div></div>`;
}
P.social=()=>`<section class="grp"><h2>Add a platform</h2><p class="hint">Tap one to add it, then type your handle or link below.</p>
<div class="chips">${Object.entries(PLAT).map(([k,p])=>`<button type="button" class="chip" data-act="addSoc" data-p="${k}"><span class="chipic" style="background:${p.c};color:${p.ink||'#ffffff'}">${svg(p.ic)}</span>${p.n}</button>`).join('')}</div></section>

${range('soc.size','Size',28,64,1,'px')}

${seg('soc.pos','Position',[['top','Under bio'],['bottom','Under buttons']])}</section>

P.background=()=>{const b=state.bg,U=USES[b.kind]||{},labels=CLABELS[b.kind]||['Color'];return `<section class="grp"><h2>Wallpaper ideas</h2><p class="hint">Pick one to start, then fine-tune it below.</p>

<section class="grp"><h2>Customize</h2>${seg('bg.kind','Type',KINDS,'sm')}
${b.kind==='photo'?`<div class="field"><span class="lbl">Your photo</span>${uploadPicker('bg.photo',false)}</div>${range('bg.dim','Darken photo',0,85,5,'%')}`:''}
<div class="row3">${labels.map((t,i)=>color('bg.c'+(i+1),t)).join('')}</div>
${U.angle?range('bg.angle','Angle',0,360,5,'°'):''}${U.scale?range('bg.scale','Pattern size',8,80,1,'px'):''}
${check('bg.grain','Add film grain')}
<p class="contrast" id="contrast">${contrastMsg()}</p></section>`;};

function layName(l){if(l.kind==='text')return 'Text: '+(l.txt||'').slice(0,24);if(l.kind==='el')return (EL[l.el]&&EL[l.el].n)||cap(l.el)+' icon';const u=byId(state.uploads,l.src);return u?u.name:'Image';}
function layThumb(l){return l.kind==='el'?elSrc(l):l.kind==='text'?'':src(l.src);}
function layExtra(l,p){
  if(l.kind==='text')return `${ta(p+'.txt','Text')}${seg(p+'.font','Font',[['head','Heading font'],['body','Body font']],'sm')}${range(p+'.size','Text size',10,120,1,'px')}<div class="row">${color(p+'.color','Color')}</div>${check(p+'.bold','Bold')}${seg(p+'.align','Align',[['left','Left'],['center','Center'],['right','Right']],'sm')}`;
  if(l.kind==='el')return `<div class="row">${color(p+'.c1','Color')}${EL_TWO(l.el)?color(p+'.c2','Second color'):''}</div>${EL[l.el]&&EL[l.el].txt!==undefined?inp(p+'.txt','Badge text',{max:16}):''}`;
  return '';
}
function layCard(l,i,n){
  const open=ui.openLay===l.id,p=`layers#${l.id}`;
  return `<div class="card${open||sel==='lay:'+l.id?' open':''}" id="card-${l.id}"><div class="card-h">
  <button type="button" class="card-t" data-act="openLay" data-id="${l.id}" aria-expanded="${open}"><span class="ci checker" style="background-image:url(${layThumb(l)});background-size:contain;background-repeat:no-repeat;background-position:center">${l.kind==='text'?'T':''}</span><span class="ct"><b>${esc(layName(l))}</b><small>${l.z==='front'?'In front of text':'Behind text'}</small></span></button>
  <div class="mini-ctrls">${ctrl('layers',l.id,i,n)}</div></div>
  ${open?`<div class="card-b">${layExtra(l,p)}${seg(p+'.z','Placement',[['behind','Behind text'],['front','In front of text']])}
  ${range(p+'.w','Size',4,150,1,'%')}${range(p+'.rot','Rotate',-180,180,1,'°')}${range(p+'.op','Opacity',10,100,1,'%')}${roundSlider(p+'.rad','Corners')}
  ${check(p+'.shadow','Drop shadow')}
  <div class="btnrow"><button type="button" class="btn sm" data-act="layCenter" data-id="${l.id}">Center</button><button type="button" class="btn sm" data-act="layDup" data-id="${l.id}">Duplicate</button></div></div>`:''}</div>`;
}
P.images=()=>`<section class="grp"><h2>Your images</h2>
<label class="drop" id="drop"><b>Upload images</b><span>Drop files here or click to browse. JPG, PNG, WebP, GIF or SVG.</span><input type="file" accept="image/*" multiple data-up="lib" aria-label="Upload images"></label>
${state.uploads.length?`<div class="ugrid">${state.uploads.map(u=>`<div class="uitem"><div class="uimg checker" title="${esc(u.name)}"><span style="background-image:url(${src(u.id)})"></span></div>
<div class="uact"><button type="button" class="btn sm primary" data-act="place" data-u="${u.id}">Place on page</button><button type="button" class="btn sm" data-act="bgUse" data-u="${u.id}">Background</button><button type="button" class="btn sm" data-act="avUse" data-u="${u.id}">Profile</button><button type="button" class="btn sm" data-act="cutWhite" data-u="${u.id}" title="Makes white areas see-through">Remove white bg</button><button type="button" class="btn sm icon danger" data-act="delUp" data-u="${u.id}" aria-label="Delete ${esc(u.name)}">${svg('x')}</button></div></div>`).join('')}</div>`:'<div class="empty">No images yet.</div>'}</section>

P.style=()=>{if(!state.cover)state.cover=state.accent;return `<section class="grp"><h2>Text color</h2><div class="row">${color('text','Text')}</div><p class="contrast" id="contrast">${contrastMsg()}</p></section>
<section class="grp"><h2>Fonts</h2><div class="row">${fontSel('headFont','Headings')}${fontSel('bodyFont','Body text')}</div>${range('titleSize','Name size',18,80,1,'px')}</section>
<section class="grp"><h2>Layout</h2>${seg('layout','Page layout',[['classic','Stacked'],['card','Card'],['banner','Banner'],['split','Side by side']])}
${state.layout==='card'?color('card','Card color'):''}${state.layout==='banner'?color('cover','Banner color'):''}
${check('tiles','Show buttons as tiles, 2 per row')}
${seg('deco','Name decoration',[['none','None'],['line','Line under name'],['pill','Tagline badge']],'sm')}
${check('caps','Uppercase headings')}
${seg('align','Alignment',[['center','Centered'],['left','Left']])}
<p class="hint" style="margin:0">Side by side shows your profile and buttons next to each other on computers and stacks them on phones.</p></section>`;};

const TABS=[['profile','Profile','user'],['buttons','Buttons','link'],['social','Social','at'],['sections','Sections','layout'],['elements','Elements','sparkle'],['images','Images','image'],['background','Background','palette'],['style','Style','type'],['extras','Music & fun','music']];
function contactFields(noTitle){const c=state.contact;return `${check('contact.show','Show contact card',true)}${c.show?`${noTitle?'':inp('contact.title','Card title',{max:40})}${inp('contact.phone','Phone',{ph:'+1 555 0100'})}${inp('contact.email','Email',{ph:'you@business.com'})}${inp('contact.address','Address',{ph:'Street, city'})}${inp('contact.hours','Opening hours',{ph:'Mon–Fri 9:00–18:00'})}${check('contact.vcard','Show a “Save to contacts” button')}`:''}`;}
P.sections=()=>{const x=state.sec;const one=(id,label)=>`<div class="card"><div class="card-b" style="border-top:0">${check(`sec.${id}.show`,label,true)}${x[id].show?inp(`sec.${id}.title`,'Title shown on the page and in the menu',{max:40}):''}</div></div>`;
return `<section class="grp"><h2>Website sections</h2><p class="hint">Turn your page into a small website with a menu at the top. Visitors tap a menu item and the page glides to that section.</p>
${check('sec.multi','Use sections and a menu',true)}
${x.multi?`${check('sec.nav','Show the menu at the top')}${one('about','About section')}${one('socials','Socials section')}${one('contact','Contact section')}
${seg('sec.anim','Scroll animation',[['rise','Rise up'],['fade','Fade in'],['zoom','Zoom in'],['none','None']],'sm')}
<p class="hint" style="margin:0">Sections slide in as visitors scroll. Open Preview &amp; publish to watch the animation.</p>`:'<p class="hint" style="margin:0">Your page is one simple column. Turn sections on to get a menu with About us, Our socials and Contact.</p>'}</section>`;};
P.elements=()=>{const groups={};Object.entries(EL).forEach(([k,e])=>{(groups[e.g]=groups[e.g]||[]).push(k);});const pa='#e07a3f',pb2='#ffffff';
return `<section class="grp"><h2>Text</h2><p class="hint">Add a text box, then drag it anywhere on your site. Double-click it to type.</p><div class="tadd">${TXTP.map((t,i)=>`<button type="button" class="tbtn" data-act="addText" data-i="${i}" style="font-family:${esc(fontOf(t.font==='body'?state.bodyFont:state.headFont).s)};font-size:${Math.min(t.size,26)}px;font-weight:${t.bold?700:400}">${esc(t.label)}</button>`).join('')}</div></section>
${Object.entries(groups).map(([g,ks])=>`<section class="grp"><h2>${g}</h2><div class="elgrid">${ks.map(k=>`<button type="button" class="elb" data-act="addEl" data-el="${k}" title="${esc(EL[k].n)}" aria-label="Add ${esc(EL[k].n)}"><img src="${svgData(elSvg(k,pa,pb2,EL[k].txt||''))}" alt=""></button>`).join('')}</div></section>`).join('')}
<section class="grp"><h2>Icons</h2><div class="elgrid">${LIB.map(k=>`<button type="button" class="elb" data-act="addEl" data-el="${k}" title="${cap(k)}" aria-label="Add ${cap(k)} icon"><img src="${svgData(elSvg(k,pa,'',''))}" alt=""></button>`).join('')}</div></section>
<p class="hint" style="margin:0">Click a placed element on your site to recolor it, resize it, or move it behind your text.</p>`;};
function ytId(u){u=String(u||'').trim();const m=u.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/);if(m)return m[1];return /^[A-Za-z0-9_-]{11}$/.test(u)?u:'';}
function ytStatus(){const u=state.music.url;if(!u)return `<i></i><span>No music yet. Paste a YouTube link above.</span>`;return ytId(u)?`<i class="good"></i><span>Song found. A small music button will appear on your site.</span>`:`<i class="bad"></i><span>That doesn’t look like a YouTube link. Copy it from the Share button on YouTube.</span>`;}
function musicFields(){return `${inp('music.url','YouTube link',{ph:'https://youtu.be/…'})}<p class="contrast" id="ytStatus">${ytStatus()}</p>
${check('music.autoplay','Start the music automatically')}
${seg('music.pos','Music button position',[['right','Bottom right'],['left','Bottom left']],'sm')}
<p class="hint" style="margin:0">Browsers only allow sound after a visitor taps the page, so the music starts on their first tap. Visitors can pause it or close the player any time. Music plays on your published site, not inside this editor.</p>`;}
P.extras=()=>`<section class="grp"><h2>Background music</h2><p class="hint">Paste a YouTube link to give your site a soundtrack.</p>${musicFields()}</section>
<section class="grp"><h2>Fun extras</h2>
${check('fx.confetti','Confetti burst when visitors tap a button')}
${check('fx.sparkle','Sparkle trail that follows the mouse')}
<div class="btnrow"><button type="button" class="btn" data-act="tryFx">Try the confetti</button></div>
<p class="hint" style="margin:0">Effects play on your published site and in Preview &amp; publish.</p></section>
<section class="grp"><h2>Need ideas?</h2><button type="button" class="btn primary" data-act="shuffle">${svg('sparkle')}Shuffle my design</button><p class="hint" style="margin:0">Tries new colors, fonts, buttons, layout and background. Your words and links stay the same, and Undo brings back the last look.</p></section>`;
function renderRail(){$('rail').innerHTML=TABS.map(([k,t,i])=>`<button type="button" role="tab" data-tab="${k}" aria-selected="${ui.tab===k}">${svg(i)}<span>${t}</span></button>`).join('');}
const panel=$('panel');
function renderPanel(){const f=document.activeElement?.id;panel.innerHTML=P[ui.tab]();if(f){const el=$(f);if(el&&panel.contains(el))el.focus({preventScroll:true});}if(sel)renderInsp();}
function setTab(t){if(ui.tab!==t){ui.tab=t;ui.iconFor=null;panel.scrollTop=0;}setCollapsed(false);renderRail();renderPanel();}
function setCollapsed(v){ui.collapsed=v;$('app').classList.toggle('collapsed',v);}
$('rail').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;
  if(b.dataset.tab===ui.tab&&isDesktop()&&!ui.collapsed){setCollapsed(true);$('rail').querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected','false'));toast('Settings panel hidden. Click any tool to show it again');return;}
  setTab(b.dataset.tab);});
function setCanvas(d){ui.cdev=d;$('frame').className='frame '+d;$('devTog').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.cdev===d));requestAnimationFrame(()=>{positionHandle();positionInsp();});}
$('devTog').addEventListener('click',e=>{const b=e.target.closest('[data-cdev]');if(b)setCanvas(b.dataset.cdev);});

/* floating edit box beside the selected element */
const NAMES={contact:'Contact card',music:'Music player',name:'Name',tagline:'Tagline',bio:'About text',footer:'Footer',avatar:'Profile picture',social:'Social icons',page:'Background'};
function renderSelbar(){renderInsp();}
function socLook(){return `${check('soc.frame','Put icons inside a shape',true)}${state.soc.frame?roundSlider('soc.round','Shape corners'):''}${seg('soc.color','Color',[['text','Text'],['brand','Platform'],['accent','Button']],'sm')}${range('soc.size','Size',28,64,1,'px')}${check('soc.labels','Show platform names')}`;}
function inspBody(){
  const [t,id]=sel.split(':');let title=NAMES[sel]||'',body='',del='';
  if(t==='btn'){
    const b=byId(state.links,id);if(!b)return null;
    if(!b.custom){b.cStyle=state.btnStyle;b.cFill=state.accent;b.cFg=state.btnText;b.cRound=state.round;}
    const p=`links#${id}`;title='Button';
    body=`${inp(p+'.label','Button text',{max:80})}${inp(p+'.url','Link',{type:'url',ph:'facebook.com/yourpage'})}
    ${roundSlider(p+'.cRound','Corners')}
    ${seg(p+'.cStyle','Style',STYLES,'sm')}
    <div class="row">${color(p+'.cFill','Button color')}${color(p+'.cFg','Text color')}</div>
    <div class="field"><span class="lbl">Icon</span>${iconPicker(p+'.icon')}</div>
    <div class="field"><span class="lbl">Logo or picture</span>${uploadPicker(p+'.thumb')}</div>
    ${b.thumb?seg(p+'.thumbFit','',[['fill','Fill the square'],['raw','Logo as-is']],'sm'):''}
    ${seg(p+'.size','Size',[['','Default'],['s','S'],['m','M'],['l','L']],'sm')}
    ${seg(p+'.width','Width',[['full','Full'],['fit','Fit text']],'sm')}
    ${seg(p+'.anim','Animation',[['none','None'],['pulse','Pulse'],['wiggle','Wiggle'],['bounce','Bounce'],['shine','Shine']],'sm')}
    <div class="btnrow"><button type="button" class="btn sm" data-act="btnAll" data-id="${id}">Use this look on all buttons</button><button type="button" class="btn sm" data-act="dupLink" data-id="${id}">Duplicate</button></div>`;
    del=`<button type="button" class="btn icon ghost danger" data-act="del" data-kind="links" data-id="${id}" aria-label="Delete button" title="Delete">${svg('trash')}</button>`;
  }else if(t==='soc'){
    const x=byId(state.socials,id);if(!x)return null;const p=PLAT[x.platform]||PLAT.website,pp=`socials#${id}`;title=p.n;
    body=`<div class="field"><label for="${fid(pp+'.platform')}">Platform</label><select id="${fid(pp+'.platform')}" data-k="${pp}.platform" data-r>${Object.entries(PLAT).map(([k,v])=>`<option value="${k}"${k===x.platform?' selected':''}>${v.n}</option>`).join('')}</select></div>
    ${inp(pp+'.url','Link or handle',{ph:p.p+'yourname'})}
    ${check(pp+'.bare','Show logo as-is (nothing behind it)',true)}
    <div class="field"><span class="lbl">Your own logo</span>${uploadPicker(pp+'.img')}</div>
    <div class="field"><span class="lbl">Icon</span>${iconPicker(pp+'.icon','Default')}</div>
    <h4>All social icons</h4>${socLook()}`;
    del=`<button type="button" class="btn icon ghost danger" data-act="del" data-kind="socials" data-id="${id}" aria-label="Remove account" title="Remove">${svg('trash')}</button>`;
  }else if(sel==='social'){body=socLook();}
  else if(t==='lay'){
    const l=byId(state.layers,id);if(!l)return null;const p=`layers#${id}`;title='Image';
title=l.kind==='text'?'Text box':l.kind==='el'?layName(l):'Image';
    body=`${layExtra(l,p)}${seg(p+'.z','Placement',[['behind','Behind text'],['front','In front of text']],'sm')}${range(p+'.w','Size',4,150,1,'%')}${roundSlider(p+'.rad','Corners')}${range(p+'.rot','Rotate',-180,180,1,'°')}${range(p+'.op','Opacity',10,100,1,'%')}${check(p+'.shadow','Drop shadow')}
    <div class="btnrow"><button type="button" class="btn sm" data-act="layCenter" data-id="${id}">Center</button><button type="button" class="btn sm" data-act="layDup" data-id="${id}">Duplicate</button></div>`;
    del=`<button type="button" class="btn icon ghost danger" data-act="del" data-kind="layers" data-id="${id}" aria-label="Delete image" title="Delete">${svg('trash')}</button>`;
  }else if(sel==='name'){body=`${inp('name','Text',{max:60})}${range('titleSize','Size',18,80,1,'px')}${fontSel('headFont','Font')}${color('text','Text color')}${seg('align','Alignment',[['center','Center'],['left','Left']],'sm')}`;}
  else if(sel==='tagline'){body=`${inp('tagline','Text',{max:90})}${fontSel('bodyFont','Font')}${color('text','Text color')}`;}
  else if(sel==='bio'){body=`${ta('bio','Text')}${fontSel('bodyFont','Font')}${color('text','Text color')}`;}
  else if(sel==='footer'){body=`${inp('footer','Text',{max:80})}`;}
  else if(sel==='avatar'){body=`<div class="btnrow"><label class="btn sm">Upload photo or logo<input type="file" accept="image/*" data-up="avatar"></label>${state.avatar?'<button type="button" class="btn sm ghost danger" data-act="avClear">Remove</button>':''}</div>
    <div class="field"><span class="lbl">Or pick from your images</span>${uploadPicker('avatar',false)}</div>${roundSlider('avRound','Corners')}${range('avSize','Size',56,180,2,'px')}`;}
  else if(sel==='page'){const lb=CLABELS[state.bg.kind]||['Color'];body=`<div class="walls">${WALLS.slice(0,9).map((w,i)=>`<button type="button" class="wall" data-act="wall" data-i="${i}" style="${esc('background:'+bgLayers(w.bg,()=>''))}" aria-label="${w.name}" title="${w.name}"><span>${w.name}</span></button>`).join('')}</div>
    <div class="row">${lb.slice(0,2).map((x,i)=>color('bg.c'+(i+1),x)).join('')}</div><p class="hint" style="margin:0">More wallpapers, patterns and photo backgrounds are under All settings.</p>`;}
  else if(sel==='contact'){body=contactFields();}
  else if(t==='sec'){const o=state.sec[id];if(!o)return null;title={about:'About section',socials:'Socials section',contact:'Contact section'}[id];
    body=`${inp(`sec.${id}.title`,'Section title',{max:40})}${check(`sec.${id}.show`,'Show this section',true)}${id==='about'?ta('bio','About text'):id==='contact'?contactFields(true):socLook()}`;}
  else if(sel==='music'){body=musicFields();}
  else return null;
  return {title,body,del};
}
function renderInsp(){
  const box=$('insp');
  if(!sel){box.hidden=true;box.innerHTML='';return;}

/* uploads */
function readImage(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=()=>rej(new Error('read'));
    if(file.type==='image/svg+xml'||(file.type==='image/gif'&&file.size<2.5e6)){r.onload=()=>res(r.result);r.readAsDataURL(file);return;}
    r.onload=()=>{const img=new Image();img.onload=()=>{
      const max=1400,sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      let d=c.toDataURL('image/webp',.85);if(!d.startsWith('data:image/webp'))d=c.toDataURL(file.type==='image/jpeg'?'image/jpeg':'image/png',.85);res(d);
    };img.onerror=()=>rej(new Error('decode'));img.src=r.result;};
    r.readAsDataURL(file);
  });
}
async function handleFiles(files,purpose,path,at){
  const imgs=files.filter(f=>f.type.startsWith('image/'));
  if(!imgs.length){toast('Choose an image file: JPG, PNG, WebP, GIF or SVG');return;}
  toast(imgs.length>1?`Adding ${imgs.length} images…`:'Adding image…');
  const ids=[];
  for(const f of imgs){try{const d=await readImage(f);const id='u'+uid();state.uploads.push({id,src:d,name:(f.name.replace(/\.[^.]+$/,'')||'Image').slice(0,40)});ids.push(id);}catch(err){toast(`Couldn't read ${f.name}. Try a JPG or PNG`);}}
  if(!ids.length)return;
  let msg=ids.length>1?`${ids.length} images added`:'Image added';
  if(purpose==='avatar'){state.avatar=ids[0];state.showAv=true;msg='Profile picture updated';}
  else if(purpose==='bg'){state.bg.kind='photo';state.bg.photo=ids[0];msg='Wallpaper updated';}
  else if(purpose==='pick'){set(path,ids[0]);if(path.endsWith('.img'))ui.iconFor=null;if(!$('pub').hidden)renderPub();}
  else if(purpose==='place'){ids.forEach((id,i)=>addLayer(id,at,i));msg='Image placed. Drag it to move it';renderSelbar();}
  render();renderPanel();toast(msg);
}

function issues(){
  const out=[],pl=n=>n>1?'s':'';
  const nolink=state.links.filter(b=>!String(b.url).trim()).length;if(nolink)out.push(['warn',`${nolink} button${pl(nolink)} ha${nolink>1?'ve':'s'} no link yet`]);
  const ex=state.links.filter(b=>/example\.com/i.test(b.url)).length;if(ex)out.push(['warn',`${ex} button${pl(ex)} still use${ex>1?'':'s'} example links`]);
  const pre=Object.values(PLAT).map(p=>p.p),bare=state.socials.filter(s=>pre.includes(s.url)).length;if(bare)out.push(['warn',`${bare} social account${pl(bare)} need${bare>1?'':'s'} your handle`]);
  const r=bgRefs(state.bg);if(r&&Math.min(...r.map(c=>contrast(state.text,c)))<3)out.push(['warn','Text is hard to read on your background']);
  const kb=Math.round(buildPage(state).length/1024);if(kb>2000)out.push(['warn',`Your site is ${kb} KB. Fewer or smaller images will load faster`]);
  if(!out.length)out.push(['ok','Everything looks ready']);
  return out;
}
/* hosted publishing: cloud.js talks to the backend. Without it, the download steps below still work */
let cloud=null,cloudChecked=false,cloudUser=null,cloudPage=null,cloudError='',cloudNote='',cloudBusy=false,authMode='signup',authEmail='',authPass='';
const recoveringPassword=/type=recovery/.test(location.hash);
const SLUG_RE=/^[a-z0-9][a-z0-9-]{1,28}[a-z0-9]$/,MAX_PAGE_BYTES=2097152;
const pageUrl=slug=>location.origin+'/'+slug;
const byteSize=s=>new Blob([s]).size;
async function refreshCloud(){
  cloudUser=await cloud.getUser();
  cloudPage=cloudUser?await cloud.getPage(cloudUser):null;
  if(cloudPage&&!state.site.slug)state.site.slug=cloudPage.slug;
}
async function cloudTask(task){
  if(cloudBusy)return;
  cloudBusy=true;cloudError='';cloudNote='';renderPub();
  try{await task();}catch(e){cloudError=e.message||'Something went wrong. Please try again.';}
  cloudBusy=false;renderPub();
}
function publishToCloud(){
  cloudTask(async()=>{
    const slug=slugify(state.site.slug)||siteSlug();
    if(!SLUG_RE.test(slug))throw new Error('Your web address needs 3 to 30 letters, numbers or dashes.');
    if(cloud.reservedSlugs.includes(slug))throw new Error('That web address isn’t available. Try another one.');
    if(!cloudUser){
      const email=$('authEmail').value.trim(),pass=$('authPass').value;
      if(!email||!pass)throw new Error('Enter your email and password to publish.');
      if(authMode==='signup'&&pass.length<8)throw new Error('Use at least 8 characters for your password.');
      cloudUser=authMode==='signup'?await cloud.signUp(email,pass):await cloud.signIn(email,pass);
      authPass='';
      if(!cloudUser){authMode='signin';cloudNote='Check your email to confirm your account, then sign in here to publish.';return;}
      cloudPage=await cloud.getPage(cloudUser);
      // Publishing now could replace a saved page with this browser's draft, so let them choose
      if(cloudPage){if(!state.site.slug)state.site.slug=cloudPage.slug;cloudNote='You already have a saved page. Load it to keep editing, or click Publish site to replace it.';return;}
    }
    if(cloudPage&&cloudPage.blocked)throw new Error('This page was taken down for breaking the rules, so it can’t be published.');
    const html=buildPage(state);
    state.site.slug=slug;
    if(byteSize(html)>MAX_PAGE_BYTES||byteSize(JSON.stringify(state))>MAX_PAGE_BYTES)throw new Error('Your page is over the 2 MB limit. Use fewer or smaller images.');
    await cloud.publishPage(cloudUser,slug,state,html);
    cloudPage={slug,published:true,blocked:false};
    state.publishedAt=Date.now();scheduleSave();pubStep='done';toast('Your page is live');
  });
}
function accountHTML(){
  if(authMode==='newpass')return `<section class="grp"><h2>Choose a new password</h2>

    <p class="hint" style="margin:0">Signed in as <b>${esc(cloudUser.email)}</b></p>
    ${cloudPage?`<p class="hint" style="margin:0">Your saved page is at <b>/${esc(cloudPage.slug)}</b>${cloudPage.published?'':' and is offline'}.</p>`:''}
    <div class="btnrow">${cloudPage?'<button type="button" class="btn" data-act="loadSaved">Load my saved page</button>':''}<button type="button" class="btn ghost" data-act="signOut">Sign out</button></div></section>`;
  const signup=authMode==='signup';

    <div class="seg sm" role="group" aria-label="Account"><button type="button" data-act="authMode" data-mode="signup" aria-pressed="${signup}">Create account</button><button type="button" data-act="authMode" data-mode="signin" aria-pressed="${!signup}">Sign in</button></div>
    <div class="field"><label for="authEmail">Email</label><input type="email" id="authEmail" autocomplete="email" placeholder="you@example.com" value="${esc(authEmail)}"></div>
    <div class="field"><label for="authPass">Password</label><input type="password" id="authPass" autocomplete="${signup?'new-password':'current-password'}" minlength="8" placeholder="${signup?'At least 8 characters':''}" value="${esc(authPass)}"></div>
    ${signup?'':'<button type="button" class="btn ghost sm" data-act="forgotPass">Forgot password?</button>'}</section>`;
}
function renderCloudPub(f,slug){
  const status=(cloudError?`<p class="hint" role="alert" style="margin:0;color:var(--danger)">${esc(cloudError)}</p>`:'')+(cloudNote?`<p class="hint" role="status" style="margin:0;color:var(--ink)">${esc(cloudNote)}</p>`:'');
  $('pcUrl').textContent=location.host+'/'+slug;
  if(pubStep==='setup'){
    f.innerHTML=`<section class="grp"><h2>Name your page</h2>
      <div class="field"><label for="${fid('site.slug')}">Web address</label><input type="text" id="${fid('site.slug')}" data-k="site.slug" value="${esc(state.site.slug)}" placeholder="${esc(slug)}" maxlength="30" autocapitalize="off" spellcheck="false"><span class="hint" style="margin:0">Your page will be at <b id="slugPreview">${esc(location.host+'/'+slug)}</b></span></div>
      ${inp('site.title','Page name (shows in the browser tab)',{max:60,ph:state.name})}
      <div class="field"><label for="${fid('site.desc')}">Description for Google and shared links</label><textarea id="${fid('site.desc')}" data-k="site.desc" maxlength="160" placeholder="${esc(state.tagline)}">${esc(state.site.desc)}</textarea></div>
      <div class="field"><span class="lbl">Browser tab icon</span>${uploadPicker('site.favicon')}</div></section>
      <section class="grp"><h2>Before you publish</h2><ul class="checks">${issues().map(([k,t])=>`<li class="${k}"><i></i><span>${esc(t)}</span></li>`).join('')}</ul></section>
      ${accountHTML()}${status}
      <button type="button" class="btn primary big" data-act="doPublish"${cloudBusy?' disabled':''}>${cloudBusy?'Working…':'Publish site'}</button>
      <p class="hint" style="margin:0">By publishing, you agree to the <a href="/terms" target="_blank" rel="noopener">OmniLink rules</a>. Your page will be public.</p>`;
  }else{
    const url=pageUrl(cloudPage.slug);
    f.innerHTML=`<section class="grp"><h2>Your page is live</h2>
      <p style="margin:0;font-family:var(--f-mono,monospace);font-size:12px;overflow-wrap:anywhere">${esc(url)}</p>
      <div class="btnrow"><a class="btn primary" href="${esc(url)}" target="_blank" rel="noopener">Open my page</a><button type="button" class="btn" data-act="copyLink">Copy link</button></div>
      <p class="hint" style="margin:0">To change your page, edit it and publish again. Visitors may see the old version for about a minute.</p></section>
      <section class="grp"><h2>Keep a copy</h2><button type="button" class="btn" data-act="copySite">Copy site code</button><textarea id="codeBox" readonly hidden aria-label="Site code"></textarea></section>
      ${status}
      <div class="btnrow"><button type="button" class="btn ghost" data-act="pubBack">Back to page settings</button><button type="button" class="btn danger" data-act="takeOffline"${cloudBusy?' disabled':''}>Take page offline</button></div>`;
  }
}
function renderPub(){
  const f=$('pubForm'),slug=siteSlug();
  if($('authEmail'))authEmail=$('authEmail').value;
  if($('authPass'))authPass=$('authPass').value;
  if(cloud){renderCloudPub(f,slug);return;}
  $('pcUrl').textContent='https://'+slug+'.netlify.app';
  if(pubStep==='setup'){
    f.innerHTML=`<section class="grp"><h2>Name your site</h2>
      ${inp('site.title','Site name (shows in the browser tab)',{max:60,ph:state.name})}
      <div class="field"><label for="${fid('site.slug')}">Web address name</label><input type="text" id="${fid('site.slug')}" data-k="site.slug" value="${esc(state.site.slug)}" placeholder="${esc(slug)}" maxlength="40"><span class="hint" style="margin:0">Suggested address: <b>${esc(slug)}.netlify.app</b>. Your host confirms the final address.</span></div>
      <div class="field"><label for="${fid('site.desc')}">Description for Google and shared links</label><textarea id="${fid('site.desc')}" data-k="site.desc" maxlength="160" placeholder="${esc(state.tagline)}">${esc(state.site.desc)}</textarea></div>
      <div class="field"><span class="lbl">Browser tab icon</span>${uploadPicker('site.favicon')}</div></section>
      <section class="grp"><h2>Before you publish</h2><ul class="checks">${issues().map(([k,t])=>`<li class="${k}"><i></i><span>${esc(t)}</span></li>`).join('')}</ul>
      <p class="hint" style="margin:0">Check the previews on the right. That’s exactly what your customers will see.</p></section>
      <button type="button" class="btn primary big" data-act="doPublish">Publish site</button>`;
  }else{
    f.innerHTML=`<section class="grp"><h2>Your site is ready to go live</h2>
      <p style="margin:0">OmniLinkWebBuilder builds your site but doesn’t host it, so the last step is putting your site file on a free host. It takes about a minute.</p>
      <div class="btnrow">${dlApi?'<button type="button" class="btn primary" data-act="dlSite">Download index.html</button>':''}<button type="button" class="btn${dlApi?'':' primary'}" data-act="copySite">Copy site code</button></div>
      <textarea id="codeBox" readonly hidden aria-label="Site code"></textarea>
      <ol class="steps"><li>${dlApi?'Download your site file (index.html).':'Copy the code, paste it into a new text file and save it as <b>index.html</b>.'}</li>
      <li>Make a folder called <b>${esc(slug)}</b> and put index.html inside.</li>
      <li>Open <a href="https://app.netlify.com/drop" target="_blank" rel="noopener">Netlify Drop</a> and drag the folder onto the page.</li>
      <li>You get a live link right away. Create a free account to keep it and rename the address to <b>${esc(slug)}</b>.</li></ol>
      <p class="hint" style="margin:0">Other free hosts: GitHub Pages or Cloudflare Pages. When you change your design later, publish again and upload the new file.</p>
      <button type="button" class="btn ghost" data-act="pubBack">Back to site settings</button></section>`;
  }
}
function fitFrames(){
  const pc=$('pcFit'),ph=$('phFit');
  if(pc.clientWidth){const s=pc.clientWidth/1280;$('pcFrame').style.transform=`scale(${s})`;pc.style.height=Math.round(800*s)+'px';}
  if(ph.clientWidth){const s=ph.clientWidth/390;$('phFrame').style.transform=`scale(${s})`;ph.style.height=Math.round(780*s)+'px';}
}
new ResizeObserver(()=>fitFrames()).observe($('pubPrev'));
function openPub(){
  if(editing)document.activeElement?.blur?.();
  const html=buildPage(state);$('pcFrame').srcdoc=html;$('phFrame').srcdoc=html;
  pubStep='setup';renderPub();$('pub').hidden=false;requestAnimationFrame(fitFrames);$('pubClose').focus();

const PALETTES=[
  ['#fdf6ec','#f3e3cc','#3b2a1e','#c8553d','#ffffff','#ffffff'],['#0f172a','#1e293b','#e2e8f0','#38bdf8','#0f172a','#1e293b'],
  ['#f0f7f4','#d3eadf','#183a2c','#2d6a4f','#ffffff','#ffffff'],['#1b1b2f','#2e2e4f','#f5f3ff','#ff6f91','#1b1b2f','#26264a'],
  ['#fff7f9','#ffd6e0','#4a1d2f','#d63f6c','#ffffff','#ffffff'],['#f4f1ff','#ddd6fe','#2e1065','#7c3aed','#ffffff','#ffffff'],
  ['#fefae0','#e9edc9','#283618','#bc6c25','#fefae0','#ffffff'],['#0b132b','#1c2541','#ffffff','#5bc0be','#0b132b','#1c2541'],
  ['#ffffff','#eef2f6','#111827','#111827','#ffffff','#f8fafc'],['#fff4e6','#ffd8a8','#3d1f00','#e8590c','#ffffff','#ffffff'],
  ['#e6f4f1','#b2dfdb','#00332e','#00897b','#ffffff','#ffffff'],['#141414','#232323','#f5f5f5','#e4ff3a','#141414','#1f1f1f']];
const FONT_PAIRS=[['Fraunces','Lora'],['Playfair Display','Outfit'],['Syne','Outfit'],['Archivo','Archivo'],['Nunito','Nunito'],['DM Serif Display','Nunito'],['Bebas Neue','Archivo'],['Outfit','Outfit'],['Space Mono','Outfit'],['Pacifico','Nunito'],['Caveat','Nunito'],['Lora','Lora']];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffleDesign(){
  const p=pick(PALETTES),dark=lum(p[2])>.5,kind=pick(['solid','gradient','glow','mesh','dots','grid','stripes','waves','zigzag','confetti']);
  state.bg=Object.assign(mkbg({kind,c1:p[0],c2:p[1],c3:kind==='confetti'?p[3]:p[0],angle:pick([135,160,180,200]),scale:pick([22,28,34]),grain:Math.random()<.3}),{photo:state.bg.photo,dim:state.bg.dim});
  state.text=p[2];state.accent=p[3];state.btnText=p[4];state.card=p[5];state.cover=p[3];
  const f=pick(FONT_PAIRS);state.headFont=f[0];state.bodyFont=f[1];state.titleSize=FONTS[f[0]].big?46:f[0]==='Pacifico'?34:32;
  state.btnStyle=pick(dark?['filled','outline','glass','soft']:['filled','outline','shadow','soft']);
  state.round=pick([0,2,4,6,8,10]);state.avRound=pick([2,7,10,10]);
  state.layout=pick(['classic','card','banner','split']);state.tiles=Math.random()<.3;state.deco=pick(['none','line','pill']);state.caps=Math.random()<.25;
  state.soc.frame=Math.random()<.7;state.soc.round=pick([2,6,10]);state.soc.color=pick(['text','accent','brand']);
  state.links.forEach(x=>{x.custom=false;x.cInit=false;});state.template='';
}
function confettiAt(r){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const C=[state.accent,state.text,'#ffd166','#06d6a0','#ef476f'],x=r.left+r.width/2,y=r.top+r.height/2;
  for(let i=0;i<26;i++){const d=document.createElement('span');d.style.cssText=`position:fixed;z-index:80;pointer-events:none;width:8px;height:12px;border-radius:2px;left:${x}px;top:${y}px;background:${C[i%C.length]}`;document.body.appendChild(d);
    const a=Math.random()*Math.PI*2,v=60+Math.random()*130;d.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v+120}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:900+Math.random()*500,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>d.remove();}
}

const CATS=[...new Set(TEMPLATES.map(t=>t.cat))].sort((x,y)=>x.localeCompare(y));
let galCat='';
function renderGallery(){
  const un=untouched();
  $('galLead').textContent=un?'Pick a design made for your kind of work. It comes with example text and contact details that you can replace with your own.':'Each preview shows your own content. Switching templates only changes the design, never your text, links or images.';
  $('galCats').innerHTML=[['','All',TEMPLATES.length]].concat(CATS.map(c=>[c,c,TEMPLATES.filter(t=>t.cat===c).length])).map(([v,t,n])=>`<button type="button" class="gchip" data-cat="${esc(v)}" aria-pressed="${galCat===v}">${esc(t)} <small>${n}</small></button>`).join('');
  const card=t=>`<button type="button" class="gcard${state.template===t.id?' cur':''}" data-tid="${t.id}" data-q="${esc((t.name+' '+t.cat+' '+t.sub+' '+t.kw).toLowerCase())}" aria-label="Use the ${esc(t.name)} template"><span class="gprev" data-prev="${t.id}"></span><span class="gmeta"><b>${esc(t.name)}</b><small>${esc(t.sub)}</small>${state.template===t.id?'<span class="pill">Current</span>':''}</span><span class="guse">Use this template</span></button>`;
  $('galGrid').innerHTML=CATS.map(c=>`<section class="gsec" data-sec="${esc(c)}"><h2>${esc(c)}</h2><div class="gal-grid">${TEMPLATES.filter(t=>t.cat===c).map(card).join('')}</div></section>`).join('')+'<p class="empty" id="galNone" hidden>No templates match. Try a job like “doctor”, “lawyer” or “bakery”.</p>';
  $('galGrid').querySelectorAll('[data-prev]').forEach(el=>{
    const t=TEMPLATES.find(x=>x.id===el.dataset.prev);
    const m=Object.assign({},state,clone(t.s),un?sampleContent(t):{});m.bg.photo=state.bg.photo;m.music={url:''};
    const sh=el.attachShadow({mode:'open'});
    sh.innerHTML=`<style>${buildCSS(m,'.pb',src)}:host{display:block}.pg{width:390px;height:760px;overflow:hidden;pointer-events:none;transform-origin:0 0}.pb{min-height:760px}</style><div class="pg"><div class="pb">${buildBody(m,src,false)}</div></div>`;
  });
  filterGallery();
}
function filterGallery(){
  const q=$('galSearch').value.trim().toLowerCase().split(/\s+/).filter(Boolean);let any=false;
  $('galGrid').querySelectorAll('.gsec').forEach(sec=>{let vis=0;const catOk=!galCat||sec.dataset.sec===galCat;
    sec.querySelectorAll('.gcard').forEach(c=>{const ok=catOk&&q.every(w=>c.dataset.q.includes(w));c.hidden=!ok;if(ok)vis++;});
    sec.hidden=!vis;if(vis)any=true;});
  const none=$('galNone');if(none)none.hidden=any;
  $('galCats').querySelectorAll('.gchip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.cat===galCat));
  requestAnimationFrame(fitGallery);
}
$('galSearch').addEventListener('input',filterGallery);
$('galCats').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;galCat=b.dataset.cat;filterGallery();$('gallery').scrollTo({top:0,behavior:'smooth'});});
function fitGallery(){$('galGrid').querySelectorAll('.gprev').forEach(el=>{const pgx=el.shadowRoot&&el.shadowRoot.querySelector('.pg');if(pgx&&el.clientWidth)pgx.style.transform=`scale(${el.clientWidth/390})`;});}
